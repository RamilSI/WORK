{% extends "base.html" %}
{% block title %}Каталог материалов | Tonal{% endblock %}
{% block content %}
<section class="section">
    <div class="container">
        <h2 class="section-title">Каталог материалов</h2>
        <div class="catalog-filters" style="text-align: center; margin-bottom: 30px;">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="грунтовка">Грунтовки</button>
            <button class="filter-btn" data-filter="эмаль">Эмали</button>
            <button class="filter-btn" data-filter="грунт-эмаль">Грунт-эмали</button>
        </div>
        <div class="catalog-list">
            {% for product in products %}
            <a href="/product/{{ product.slug }}" class="catalog-row" data-type="{{ product.type }}">
                <span class="catalog-row-name">{{ product.name }}</span>
                <span class="catalog-row-desc">{{ product.short_desc }}</span>
            </a>
            {% endfor %}
        </div>
    </div>
</section>
<script>
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const filter = this.dataset.filter;
            document.querySelectorAll('.catalog-row').forEach(item => {
                if (filter === 'all' || item.dataset.type === filter) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    });
</script>
{% endblock %}
