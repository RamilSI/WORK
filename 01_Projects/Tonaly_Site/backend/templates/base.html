<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tonal — Антикоррозионная защита и ЛКМ{% endblock %}</title>
    <link rel="stylesheet" href="/css/style.css?v=20260830d">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <nav class="container main-nav">
            <a href="/" class="logo">
                <img src="/img/logo.svg" alt="ООО «Тональ»" class="logo-img">
            </a>
            <button class="nav-toggle" type="button" aria-label="Меню" onclick="document.querySelector('.nav-links').classList.toggle('is-open')">
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="/catalog">Каталог</a></li>
                <li><a href="/about">О компании</a></li>
                <li><a href="/#applications">Применение</a></li>
                <li><a href="/#tools">Сервисы</a></li>
                <li><a href="/contacts">Контакты</a></li>
                <li><a href="#" class="login-btn">Личный кабинет</a></li>
            </ul>
        </nav>
    </header>

    {% block hero %}{% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2026 ООО «Тональ». Антикоррозионная защита металлоконструкций</p>
            <div class="footer-links">
                <a href="/catalog">Каталог</a>
                <a href="/about">О компании</a>
                <a href="/contacts">Контакты</a>
            </div>
        </div>
    </footer>
    {% if metrika_id %}
    <script type="text/javascript">
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
        ym({{ metrika_id }}, "init", {
            clickmap:true,
            trackLinks:true,
            accurateTrackBounce:true,
            webvisor:true
        });
    </script>
    <noscript><div><img src="https://mc.yandex.ru/watch/{{ metrika_id }}" style="position:absolute; left:-9999px;" alt=""></div></noscript>
    {% endif %}
</body>
</html>
