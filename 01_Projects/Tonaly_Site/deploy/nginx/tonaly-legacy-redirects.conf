# Безопасный if+return: только если URI есть в map.
# Подключать внутри server { } до location /.
# /Catalog нельзя класть в map: nginx hash не различает регистр и ломает /catalog.
location = /Catalog {
    return 301 /catalog?brand=akzo;
}
location = /Catalog/ {
    return 301 /catalog?brand=akzo;
}
if ($tonaly_legacy_target != "") {
    return 301 $tonaly_legacy_target;
}
