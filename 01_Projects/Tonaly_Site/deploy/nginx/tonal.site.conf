server {
    listen 80;
    listen 443 ssl;
    server_name rml-s.ru www.rml-s.ru tonaly.ru www.tonaly.ru 46.173.19.173;

    ssl_certificate /etc/letsencrypt/live/rml-s.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rml-s.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/tonaly-legacy-redirects.conf;

    location /css/ {
        alias /var/www/tonal/frontend/css/;
    }

    location /img/ {
        alias /var/www/tonal/frontend/img/;
    }

    location /docs/ {
        alias /var/www/tonal/frontend/docs/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
